# Free-tier, short-lived DEM processing for small study areas only.
# No persistent disk, paid plan, database, or private API key in source.
services:
  - type: web
    name: geodem-gdal-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: OPENTOPOGRAPHY_API_KEY
        sync: false
      - key: GEODEM_ACCESS_TOKEN
        generateValue: true
      - key: GEODEM_CORS_ORIGINS
        value: https://geodem-explorer.vercel.app
      - key: DATA_DIR
        value: /tmp/geodem
      - key: JOB_WORKERS
        value: "1"
      - key: MAX_ACTIVE_JOBS
        value: "1"
      - key: MAX_AREA_KM2
        value: "100"
      - key: MAX_TILES_PER_DATASET
        value: "4"
      - key: MAX_TOTAL_TILE_REQUESTS
        value: "8"
      - key: MAX_TILE_MB
        value: "64"
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "90"
      - key: GDAL_CACHEMAX
        value: "32"
